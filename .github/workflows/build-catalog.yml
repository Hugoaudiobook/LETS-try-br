name: Build catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_catalog.py
      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/anime.json
          git diff --cached --quiet || git commit -m "Update anime catalogue"
          git push
